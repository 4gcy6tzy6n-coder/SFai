[workspace]
members = ["crates/sfai"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
